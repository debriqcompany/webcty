<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Rounded container with dark slate / architectural background -->
  <rect width="128" height="128" rx="28" fill="#151515"/>
  
  <!-- Subtle architectural grid lines -->
  <line x1="20" y1="20" x2="108" y2="20" stroke="#262626" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="20" y1="108" x2="108" y2="108" stroke="#262626" stroke-width="1" stroke-dasharray="2 2"/>
  
  <!-- Isometric DEBRIQ Brick Masonry Mark -->
  <g transform="translate(64, 64) scale(0.68) translate(-100, -100)">
    <!-- Top-Left Brick Top Face -->
    <polygon points="100,16 35,53 65,70 130,33" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <!-- Top-Left Brick Left Face -->
    <polygon points="35,53 65,70 65,108 35,91" fill="#D9D8D3" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Top-Right Brick Top Face -->
    <polygon points="138,38 73,75 103,92 168,55" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <!-- Top-Right Brick Front-Left Face -->
    <polygon points="73,75 103,92 103,130 73,113" fill="#D9D8D3" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <!-- Top-Right Brick Right Face -->
    <polygon points="103,92 168,55 168,93 103,130" fill="#B5B4AE" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Bottom-Left Brick Face -->
    <polygon points="35,103 100,140 100,178 35,141" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <!-- Bottom block connector -->
    <polygon points="100,140 130,123 130,161 100,178" fill="#D9D8D3" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Bottom-Right Brick Face -->
    <polygon points="138,118 168,101 168,139 138,156" fill="#F27D26" stroke="#F27D26" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
