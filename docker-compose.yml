services:
  debriq-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: debriq-engineering
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@debriq.vn}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-debriq2025}
      - SESSION_SECRET=${SESSION_SECRET:-debriq_default_session_secret_key_please_change_min_32_characters}
      - MAX_UPLOAD_SIZE_BYTES=10485760
    volumes:
      # Persistent JSON Database & Uploaded Images
      - debriq_data:/app/data
      - debriq_uploads:/app/uploads

volumes:
  debriq_data:
    driver: local
  debriq_uploads:
    driver: local
